server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: orders_service
          uri: lb://orders-service
          predicates:
            - Path=/api/orders/**
        - id: payment_service
          uri: lb://payment-service
          predicates:
            - Path=/api/payments/**
        - id: shipping_service
          uri: lb://shipping-service
          predicates:
            - Path=/api/shipping/**
        - id: users_service
          uri: lb://users-service
          predicates:
            - Path=/api/users/**
        - id: products_service
          uri: lb://products-service
          predicates:
            - Path=/api/products/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
