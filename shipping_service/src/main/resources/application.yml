server:
  port: 8083

spring:
  application:
    name: shipping-service
  datasource:
    url: jdbc:mysql://localhost:3312/shipping_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
    username: app_user
    password: 123456789
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
